plugins {
    id 'com.android.application'
}

android {
    namespace 'virga.rexinternalsd'
    compileSdk 34

    defaultConfig {
        applicationId 'virga.rexinternalsd'
        minSdk 24
        targetSdk 34      // harus >= 24 supaya bisa di-install di Android 14+
        versionCode 481
        versionName '4.9-a16'
    }

    buildFeatures {
        buildConfig true  // dipakai Preferences.java (BuildConfig.APPLICATION_ID)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

